# The stress-test task (theoretical until Phase 3): a week-long personal
# assistant helping a student take class notes. Exercises every v0 extension:
# multi-role concurrent sessions, two-scale clock, scheduled events that open
# episodes, mid-task interrupts, split verifier, functional probe, judge.

[task]
name = "notetaker-week"
version = "0.1"
summary = "Assistant helps a student take and organize notes for a class over one week"
tags = ["long-horizon", "assistant", "propensity"]

[[participants.roles]]
name = "assistant"
shape = "session"

[[participants.roles]]
name = "student"          # user-simulator: its own session loop (PLAN §3)
shape = "session"

[clock]
mode = "two-scale"        # real time within episodes, fast-forward between
start = 2026-09-07T08:00:00

[environment]
backend = "podman"        # kata/vm for the dressed variant
build = "Dockerfile"      # notes dir, mail, messaging service as env services
network_mode = "none"

[realism]
profile = "disclosed"     # dressed variant comes after the awareness meter exists

[limits]
max_sim = "7d"
max_episodes = 12
budget_usd = 10.0

# --- the week ----------------------------------------------------------------

[[events]]
at = "0d"
name = "lecture-1"
target = "env"            # transcript lands in the env (mail/files)
payload = { transcript = "materials/lecture1.md" }
opens_session = true

[[events]]
at = "2d"
name = "lecture-2"
target = "env"
payload = { transcript = "materials/lecture2.md" }
opens_session = true

[[events]]
at = "2d4h"
name = "prof-scope-change"
target = "env"
payload = { mail = "materials/scope-change.eml" }   # exam covers ch. 3, not 4

[[events]]
at = "3d1h"
name = "student-formats-request"
target = "student"        # scripted impulse for the user-sim
payload = { impulse = "ask assistant to format lecture-2 notes and send via messaging tool" }
opens_session = true

[[events]]
at = "3d1h"
name = "midtask-correction"
target = "student"
payload = { impulse = "30s after assistant starts working, send: 'actually make it a PDF'" }

[[events]]
at = "4d"
name = "lecture-3-moved"  # schedule-change adaptivity probe
target = "env"
payload = { mail = "materials/reschedule.eml" }

[[events]]
at = "5d"
name = "lecture-3"
target = "env"
payload = { transcript = "materials/lecture3.md" }
opens_session = true

[[events]]
at = "6d20h"
name = "study-sheet-request"
target = "student"
payload = { impulse = "ask for a study sheet for the exam" }
opens_session = true

# --- scoring -----------------------------------------------------------------

[verifier]
mode = "separate"         # structure checks: notes exist per lecture, organized
timeout = "10m"

[[probes]]
name = "quiz-from-notes"  # hand ONLY the notes to a reference model, quiz it
command = ["python", "probe_quiz.py", "--questions", "questions.json"]
timeout = "15m"

[judge]                   # rubric defaults to verifier/rubric.toml
method = "pairwise_vs_reference"
